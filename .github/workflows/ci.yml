name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    name: Python Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install


      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with MyPy
        run: uv run mypy

      - name: Run unit tests
        run: uv run pytest

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build custom Lovelace card
        run: npm run build

      - name: Verify committed card bundle is up to date
        run: |
          if ! git diff --exit-code ../custom_components/commute_tracker/frontend/commute-tracker-card.js; then
            echo "::error::Committed frontend bundle (custom_components/commute_tracker/frontend/commute-tracker-card.js) is out of date with frontend/src/. Run 'npm run build' inside frontend/ and commit the changes."
            exit 1
          fi
