name: HACS Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
