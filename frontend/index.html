<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commute Tracker Card — Standalone Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <style>
    :root {
      --ha-card-background: #2B2D3A;
      --ha-card-border: 1px solid rgba(255, 255, 255, 0.08);
      --ha-card-radius: 16px;
      --primary-text-color: #FFFFFF;
      --secondary-text-color: #A0A5B5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #12131C;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    .preview-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .preview-header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #FFFFFF 0%, #A0A5B5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .preview-header p {
      font-size: 13px;
      color: #7E8299;
    }

    .controls-panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      max-width: 680px;
      width: 100%;
      backdrop-filter: blur(10px);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .control-group label {
      color: #A0A5B5;
      font-weight: 500;
    }

    select, input[type="range"] {
      background: #1E202C;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #64B5F6;
    }

    .card-container {
      max-width: 480px;
      width: 100%;
      background: transparent;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-radius: 16px;
    }

    .status-banner {
      margin-top: 24px;
      font-size: 12px;
      color: #5E6278;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="preview-header">
    <h1>Commute Tracker Card</h1>
    <p>Standalone Visual Verification Harness (No Home Assistant Required)</p>
  </header>

  <nav class="controls-panel" aria-label="Preview Controls">
    <div class="control-group">
      <label for="scenario-select">Scenario:</label>
      <select id="scenario-select"></select>
    </div>

    <div class="control-group">
      <label for="progress-slider">Corridor Progress:</label>
      <input type="range" id="progress-slider" min="0" max="3" step="0.1" value="2.3">
      <span id="progress-value" style="font-family: monospace; min-width: 28px;">2.3</span>
    </div>
  </nav>

  <main class="card-container" id="mount-point">
    <!-- commute-tracker-card will be inserted here -->
  </main>


  <footer class="status-banner">
    Rendered via Lit Web Component · 1:1 Parity with Conductor PoC · Click any route module to view details
  </footer>

  <script type="module" src="/src/preview.ts"></script>
</body>
</html>
