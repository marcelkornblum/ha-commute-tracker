[project]
name = "ha-commute-tracker"
version = "0.1.0"
description = "Home Assistant custom component for commute tracking."
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-homeassistant-custom-component",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = "."
files = ["custom_components", "tests"]



[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"


